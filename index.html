<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=https://bash.hackclub.com" />
  <link rel="canonical" href="https://bash.hackclub.com" />
  <link rel="icon" type="image/png" href="cup.png" />
  <title>Boba Bash | Redirecting to Hack Club Boba Bash</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #fbf6e8;
      color: #3d2b18;
      text-align: center;
      padding: 24px;
    }
    .redirect-card {
      background: #ffffff;
      border: 2.5px solid #3d2b18;
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 6px 6px 0 #3d2b18;
      max-width: 460px;
      width: 100%;
    }
    .boba-icon {
      width: 64px;
      height: auto;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      color: #3d2b18;
    }
    p {
      font-size: 1rem;
      line-height: 1.5;
      color: #6b5842;
      margin-bottom: 20px;
    }
    .redirect-btn {
      display: inline-block;
      padding: 12px 24px;
      background: #f2c14e;
      color: #3d2b18;
      text-decoration: none;
      font-weight: 700;
      border: 2px solid #3d2b18;
      border-radius: 12px;
      box-shadow: 3px 3px 0 #3d2b18;
      font-size: 1rem;
      transition: transform 0.1s ease;
    }
    .redirect-btn:hover {
      transform: translateY(-2px);
    }
    .gn-link-wrap {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1.5px solid #e0d5c1;
      font-size: 0.92rem;
    }
    .gn-link {
      color: #3d2b18;
      font-weight: 700;
      text-decoration: underline;
    }
  </style>
  <script>
    window.location.replace("https://bash.hackclub.com");
  </script>
</head>
<body>
  <div class="redirect-card">
    <img src="cup.png" alt="Boba Bash Cup" class="boba-icon" />
    <h1>Redirecting to Boba Bash...</h1>
    <p>We are redirecting you to the official Hack Club Boba Bash homepage at <strong>bash.hackclub.com</strong>.</p>
    <a href="https://bash.hackclub.com" class="redirect-btn">Visit bash.hackclub.com &rarr;</a>
    <div class="gn-link-wrap">
      Looking for Greater Noida? <a href="/grn/" class="gn-link">Go to Greater Noida Event &rarr;</a>
    </div>
  </div>
</body>
</html>
